name: Temporary WFP diagnostic

"on":
  workflow_dispatch:

permissions: {}

jobs:
  diagnostic:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-test
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      # Temporary T064 probe; remove after the approved diagnostic is collected.
      - name: Check the prepared workspace API responses
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error("Missing Cloudflare CI token.");
          const base = "https://api.cloudflare.com/client/v4/accounts/35ff2b49c05d63c1ab9be216933c774a/workers/dispatch/namespaces/xpro-workspaces-test/scripts/xpro-test";
          const checks = [
            { name: "workspace_metadata", method: "GET", suffix: "" },
            { name: "empty_asset_upload_session", method: "POST", suffix: "/assets-upload-session", body: '{"manifest":{}}' },
          ];
          for (const check of checks) {
            try {
              const response = await fetch(base + check.suffix, {
                method: check.method,
                redirect: "error",
                headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
                body: check.body,
                signal: AbortSignal.timeout(15_000),
              });
              const data = await response.json().catch(() => null);
              const errorCodes = Array.isArray(data?.errors) ? data.errors.map(error => error?.code).filter(Number.isSafeInteger) : [];
              console.log(JSON.stringify({ check: check.name, httpStatus: response.status, jsonResponse: data !== null, errorCodes }));
              if (!response.ok || data?.success !== true) break;
            } catch {
              console.log(JSON.stringify({ check: check.name, transportFailed: true }));
              process.exitCode = 1;
              break;
            }
          }
          NODE
